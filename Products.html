<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Page</title>
    <link rel="stylesheet" href="Css/Products.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top"
    >
      <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="Home.html"
          >MyStore</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-light" href="Home.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light active" href="products.html"
                >Products</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="Wishlist.html">Wishlist</a>
            </li>
            <li class="nav-item">
              <span class="position-relative">
                <a class="nav-link text-light" href="Cart.html">Cart</a>
                <span
                  class="cart-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="display: none"
                  >0</span
                >
              </span>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="Orders.html">Orders</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Products + Filters-->
    <div class="container my-4">
      <div class="row">
        <!-- Filters Section -->
        <div class="col-md-3">
          <div
            class="card shadow-sm p-3 bg-light sticky-top"
            style="top: 80px; z-index: 100"
          >
            <h5 class="card-title mb-3">Filter Products</h5>
            <form id="filterForm">
              <!-- Search -->
              <div class="mb-3">
                <label for="searchInput" class="form-label">Search</label>
                <input
                  type="text"
                  id="searchInput"
                  class="form-control"
                  placeholder="Search by name..."
                />
              </div>

              <!-- Categories -->
              <div class="mb-3">
                <label for="categorySelect" class="form-label">Category</label>
                <select id="categorySelect" class="form-select">
                  <option value="">All Categories</option>
                </select>
              </div>

              <!-- Price -->
              <div class="mb-3">
                <label for="maxPrice" class="form-label">Max Price</label>
                <input
                  type="number"
                  id="maxPrice"
                  class="form-control"
                  placeholder="Enter max price"
                />
              </div>
              <div class="mb-3">
                <label for="minPrice" class="form-label">Min Price</label>
                <input
                  type="number"
                  id="minPrice"
                  class="form-control"
                  placeholder="Enter min price"
                />
              </div>

              <!-- Reset Button -->
              <div class="d-grid">
                <button
                  type="reset"
                  id="resetBtn"
                  class="btn btn-outline-secondary"
                >
                  Reset Filters
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Products Section -->
        <div class="col-md-9">
          <div id="productsContainer" class="row g-4">
            <!-- Products will be rendered here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Back to Top Button -->
    <button
      id="backToTop"
      type="button"
      class="btn btn-warning d-flex"
      aria-label="Back to top"
      title="Back to top"
    >
      ↑
    </button>
    <!-- Footer -->
    <footer class="bg-dark text-light pt-5">
      <div class="container">
        <div class="row text-center text-md-start">
          <!-- Contact Us -->
          <div class="col-md-4 mb-4">
            <h5 class="fw-bold text-warning">Contact Us</h5>
            <p>Email: info@google.com</p>
            <p>Phone: +121 565 5556</p>
            <p>Address: El Minia</p>
          </div>

          <!-- Quick Links -->
          <div class="col-md-4 mb-4">
            <h5 class="fw-bold text-warning">Quick Links</h5>
            <ul class="list-unstyled">
              <li>
                <a href="Home.html" class="text-light text-decoration-none"
                  >Home</a
                >
              </li>
              <li>
                <a href="products.html" class="text-light text-decoration-none"
                  >Products</a
                >
              </li>
              <li>
                <a href="Contact.html" class="text-light text-decoration-none"
                  >Contact</a
                >
              </li>
            </ul>
          </div>

          <!-- Follow Us -->
          <div class="col-md-4 mb-4">
            <h5 class="fw-bold mb-3 text-uppercase">Follow Us</h5>
            <div class="d-flex gap-3">
              <a
                href="https://facebook.com"
                target="_blank"
                class="text-light social-link"
              >
                <i class="fab fa-facebook-f fa-lg"></i>
              </a>
              <a
                href="https://twitter.com"
                target="_blank"
                class="text-light social-link"
              >
                <i class="fab fa-twitter fa-lg"></i>
              </a>
              <a
                href="https://instagram.com"
                target="_blank"
                class="text-light social-link"
              >
                <i class="fab fa-instagram fa-lg"></i>
              </a>
              <a
                href="https://linkedin.com"
                target="_blank"
                class="text-light social-link"
              >
                <i class="fab fa-linkedin-in fa-lg"></i>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer Bottom -->
      <div class="bg-warning text-dark text-center py-2 mt-4">
        &copy; 2025 ITI. All rights reserved.
      </div>
    </footer>

    <!-- Back To Top -->
    <button id="backToTop" class="btn btn-warning btn-lg">
      <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Bootstrap Links -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Js/Products.js"></script>
    <script src="Js/data.js"></script>

    <script>
      // back to top functionality
      const backToTop = document.getElementById("backToTop");
      window.onscroll = () => {
        if (
          document.body.scrollTop > 200 ||
          document.documentElement.scrollTop > 200
        ) {
          backToTop.style.display = "block";
        } else {
          backToTop.style.display = "none";
        }
      };
      backToTop.onclick = () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    </script>
  </body>
</html>
