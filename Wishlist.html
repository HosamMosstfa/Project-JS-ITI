<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist Page</title>
    <link rel="stylesheet" href="Css/Wishlist.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="Home.html"
          >MyStore</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto text-center">
            <li class="nav-item">
              <a class="nav-link" href="Home.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Wishlist.html">Wishlist</a>
            </li>
            <li class="nav-item position-relative">
              <a class="nav-link" href="Cart.html">Cart</a>
              <span
                class="cart-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                style="display: none"
                >0</span
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Orders.html">Orders</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Wishlist title -->
    <div
      class="container-fluid text-center bg-white my-4 border-top border-bottom py-4"
    >
      <h2 class="fw-bold">
        My Wishlist <i class="fa-solid fa-heart text-danger"></i>
      </h2>
    </div>

    <!-- Wishlist body -->
    <div class="container py-5">
      <div id="wishlistContainer" class="row g-4">
        <!-- JS will insert wishlist items dynamically -->
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://kit.fontawesome.com/a269cdece2.js"
      crossorigin="anonymous"
    ></script>
    <script src="Js/data.js"></script>
    <script src="Js/Wishlist.js"></script>
  </body>
</html>
