<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Page</title>

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="Css/Cart.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="Home.html"
          >MyStore</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto text-center">
            <li class="nav-item">
              <a class="nav-link" href="Home.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Wishlist.html">Wishlist</a>
            </li>
            <li class="nav-item position-relative">
              <a class="nav-link active" href="Cart.html">Cart</a>
              <span
                class="cart-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                style="display: none"
                >0</span
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Orders.html">Orders</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- cart title -->
    <div
      class="container-fluid text-center bg-white my-4 border-top border-bottom py-4"
    >
      <h2 class="fw-bold">
        Shopping Cart <i class="fa-solid fa-cart-shopping"></i>
      </h2>
    </div>

    <!-- products in cart -->
    <div class="container py-5">
      <div class="row">
        <!-- Cart Items -->
        <div class="col-lg-8">
          <div class="card mb-3">
            <div class="card-body" id="cartItems">
              <!-- Items will be injected dynamically from JS -->
            </div>
          </div>
        </div>

        <!-- Cart Summary -->
        <div class="col-lg-4">
          <div class="card cart-summary">
            <div class="card-body">
              <h5 class="card-title mb-4">Order Summary</h5>
              <div class="d-flex justify-content-between mb-3">
                <span>Subtotal</span>
                <span class="subTotal">$0.00</span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span>Shipping</span>
                <span class="Shipping">$10.00</span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span>Tax</span>
                <span class="tax">10%</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between mb-4">
                <strong>Total</strong>
                <strong class="total">$0.00</strong>
              </div>
              <button id="placeOrderBtn" class="btn btn-success w-100">
                Place Order
              </button>
            </div>
          </div>

          <!-- Promo Code -->
          <div class="card mt-4">
            <div class="card-body">
              <h5 class="card-title mb-3">Apply Promo Code</h5>
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter promo code"
                />
                <button class="btn btn-outline-secondary" type="button">
                  Apply
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome Kit -->
    <script
      src="https://kit.fontawesome.com/a269cdece2.js"
      crossorigin="anonymous"
    ></script>
    <!-- Custom Script -->
    <script src="Js/Cart.js"></script>
  </body>
</html>
